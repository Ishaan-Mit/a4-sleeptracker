<ion-header>
  <ion-toolbar>
    <ion-title>
      Sleep Tracker
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <swiper-container pagination="true" space-between="16">

    <swiper-slide>
      <ion-card>
        <ion-card-header>
          <ion-card-title>Hours slept</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          @if (overnightEntries.length === 0) {
            <p>Start logging your nightly sleep below!</p>
          }
          <div class="chart-box">
            <canvas #sleepCanvas></canvas>
          </div>
        <ion-button expand="block" routerLink="/log-sleep">Log overnight sleep</ion-button>
        </ion-card-content>
      </ion-card>
    </swiper-slide>
    
    
    <swiper-slide>
      <ion-card>
        <ion-card-header>
          <ion-card-title>Daytime Sleepiness</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          @if (sleepinessEntries.length === 0) {
            <p>Log how sleepy you feel to see your trend.</p>
          }
          <div class="chart-box">
            <canvas #sleepinessCanvas></canvas>
          </div>
        <ion-button expand="block" fill="outline" routerLink="/log-sleepiness">Log sleepiness</ion-button>
        </ion-card-content>
      </ion-card>
    </swiper-slide>
  
  </swiper-container>
</ion-content>
